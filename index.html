<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adsgram Test Protocol</title>
    <script src="https://adsgram.ai/sdk-v1.js"></script>
    <style>
        body { background: #001100; color: #1aff1a; font-family: monospace; padding: 20px; text-align: center; }
        .terminal { border: 1px solid #1aff1a; padding: 20px; margin-bottom: 20px; background: #000; }
        button { background: #1aff1a; color: #000; border: none; padding: 15px 30px; font-weight: bold; cursor: pointer; margin: 10px; }
        #banner-container { min-height: 100px; border: 1px dashed #444; margin-top: 50px; display: flex; align-items: center; justify-content: center; }
        .log { text-align: left; font-size: 12px; color: #888; }
    </style>
</head>
<body>

    <div class="terminal">
        <h1>> ADS_DIAGNOSTIC_MODE</h1>
        <p>Если SDK загружен, кнопка ниже вызовет видео.</p>
        <button onclick="showVideoAd()">[ ЗАПУСТИТЬ ТЕСТОВОЕ ВИДЕО ]</button>
        <div class="log" id="status-log">> Ожидание инициализации...</div>
    </div>

    <div id="banner-container">
        [ ТУТ ДОЛЖЕН БЫТЬ БАННЕР ]
    </div>

    <script>
        const log = document.getElementById('status-log');
        let videoAd = null;

        function addLog(msg) {
            log.innerHTML += `<br>> ${msg}`;
        }

        // 1. Инициализация при загрузке
        window.addEventListener('load', () => {
            if (window.Adsgram) {
                addLog("SDK найден. Инициализация...");
                
                // Используем ТЕСТОВЫЙ ID 272 (он работает без модерации)
                videoAd = window.Adsgram.init({ blockId: "272" });
                
                addLog("Система готова к тесту.");
                
                // Пытаемся сразу отрисовать баннер (тоже тестовый)
                showBanner();
            } else {
                addLog("<span style='color:red'>ОШИБКА: SDK НЕ ЗАГРУЖЕН! Выключите AdBlock.</span>");
            }
        });

        // Функция показа видео
        async function showVideoAd() {
            if (!videoAd) {
                addLog("Ошибка: Контроллер не готов.");
                return;
            }

            addLog("Запрос видео...");
            try {
                const result = await videoAd.show();
                if (result.done) {
                    addLog("<span style='color:yellow'>НАГРАДА ПОЛУЧЕНА! Просмотр завершен.</span>");
                }
            } catch (err) {
                addLog("Ошибка показа: " + (err.description || "Сеть прервана"));
            }
        }

        // Функция показа баннера
        function showBanner() {
            window.Adsgram.init({ 
                blockId: "272", // Используем тот же тестовый ID для типа баннер
                type: "banner" 
            }).render({
                renderTo: 'banner-container'
            }).then(() => {
                addLog("Баннер успешно загружен.");
            }).catch((err) => {
                addLog("Ошибка баннера: " + err.description);
            });
        }
    </script>
</body>
</html>
